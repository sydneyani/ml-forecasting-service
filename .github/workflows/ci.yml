name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Unit tests
        run: pytest
      - name: Train a tiny model
        run: python -m forecasting.training --config configs/ci.yaml
      - name: Score with the tiny model
        run: pytest tests/test_ci_score.py
      - name: Drift report
        run: python -m forecasting.monitoring.drift --output reports/ci/drift_report.json
